name: ai-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    branches: [develop, master]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: number
      full_review:
        required: false
        type: boolean
        default: false

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.comment.id && format('comment-{0}', github.event.comment.id) || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    uses: Privo/platform-actions/.github/workflows/review.yml@master
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    with:
      pr_number: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.pr_number) || 0 }}
      full_review: ${{ github.event_name == 'workflow_dispatch' && inputs.full_review || false }}
    secrets: inherit
